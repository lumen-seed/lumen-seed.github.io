name: Build Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload LUMEN.md artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUMEN.md
          path: LUMEN.md

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.${{ github.run_number }}
          name: "Lumen Framework Release v1.0.${{ github.run_number }}"
          body: |
            Automated release generated by GitHub Actions.
          artifacts: "README.md,README.min.md"
          draft: false
          prerelease: false
          makeLatest: true
